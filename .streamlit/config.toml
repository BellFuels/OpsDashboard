[theme]
base = "dark"
primaryColor = "#F2A73C"
backgroundColor = "#0E1A24"
secondaryBackgroundColor = "#15232E"
textColor = "#EAF1F5"
linkColor = "#F2A73C"
borderColor = "#263A48"
baseRadius = "12px"
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
# keep a session (and its loaded unified file) for 12 hours after the browser
# disconnects (laptop asleep, tab parked, Wi-Fi drop) instead of the 2-minute
# default; a loaded file is ~5.5 MB, so idle sessions are cheap
disconnectedSessionTTL = 43200
